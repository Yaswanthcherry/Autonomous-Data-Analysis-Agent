# Development overrides — hot reload, volume mounts, exposed ports
version: "3.9"

services:
  backend:
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development

  celery_worker:
    volumes:
      - ./backend:/app
    command: celery -A tasks.celery_app worker --loglevel=debug --concurrency=1 --pool=solo
    environment:
      APP_ENV: development

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    environment:
      NODE_ENV: development
